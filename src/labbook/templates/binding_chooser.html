import React from "https://esm.sh/react@18.3.1";
import ReactDOM from "https://esm.sh/react-dom@18.3.1/client";

const {
  createElement: h,
  useState,
  useEffect,
  useRef,
  useDeferredValue,
  startTransition,
  Fragment,
} = React;

const config = window.__LABBOOK_CONFIG__;

const iconProps = {
  xmlns: "http://www.w3.org/2000/svg",
  width: 14,
  height: 14,
  viewBox: "0 0 24 24",
  fill: "none",
  stroke: "currentColor",
  strokeWidth: 2,
  strokeLinecap: "round",
  strokeLinejoin: "round",
};

function ChevronRight(props) {
  return h("svg", { ...iconProps, ...props },
    h("polyline", { points: "9 18 15 12 9 6" }));
}
function ChevronDown(props) {
  return h("svg", { ...iconProps, ...props },
    h("polyline", { points: "6 9 12 15 18 9" }));
}
function FileText(props) {
  return h("svg", { ...iconProps, ...props },
    h("path", { d: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" }),
    h("polyline", { points: "14 2 14 8 20 8" }),
    h("line", { x1: 16, y1: 13, x2: 8, y2: 13 }),
    h("line", { x1: 16, y1: 17, x2: 8, y2: 17 }));
}
function Database(props) {
  return h("svg", { ...iconProps, ...props },
    h("ellipse", { cx: 12, cy: 5, rx: 9, ry: 3 }),
    h("path", { d: "M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" }),
    h("path", { d: "M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" }));
}
function Search(props) {
  return h("svg", { ...iconProps, ...props },
    h("circle", { cx: 11, cy: 11, r: 8 }),
    h("line", { x1: 21, y1: 21, x2: 16.65, y2: 16.65 }));
}
function RefreshCw(props) {
  return h("svg", { ...iconProps, ...props },
    h("polyline", { points: "23 4 23 10 17 10" }),
    h("path", { d: "M20.49 15a9 9 0 1 1-2.12-9.36L23 10" }));
}
function LoaderCircle(props) {
  return h("svg", { ...iconProps, className: "animate-spin " + (props.className || ""), ...props },
    h("path", { d: "M21 12a9 9 0 1 1-6.219-8.56" }));
}
function Check(props) {
  return h("svg", { ...iconProps, width: 12, height: 12, ...props },
    h("polyline", { points: "20 6 9 17 4 12" }));
}

/* ------------------------------------------------------------------ */
/* Utility components matching shadcn/ui originals                     */
/* ------------------------------------------------------------------ */

function cn(...args) {
  return args.filter(Boolean).join(" ");
}

function Badge({ variant = "default", className = "", children, ...rest }) {
  const base = "inline-flex items-center rounded-md border px-2.5 py-0.5 text-xs font-medium transition-colors";
  const variants = {
    default: "border-transparent bg-stone-900 text-white",
    secondary: "border-transparent bg-stone-100 text-stone-700",
    outline: "border-stone-200 text-stone-700",
  };
  return h("div", { className: cn(base, variants[variant] || variants.outline, className), ...rest }, children);
}

function Button({ variant = "default", size = "default", disabled, className = "", children, ...rest }) {
  const base = "inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-xl text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-stone-300 disabled:pointer-events-none disabled:opacity-50";
  const variants = {
    default: "bg-stone-900 text-white hover:bg-stone-800",
    secondary: "border border-stone-200 bg-white text-stone-900 hover:bg-stone-100",
  };
  const sizes = {
    default: "h-10 px-4 py-2",
    sm: "h-8 rounded-lg px-3 text-xs",
    icon: "size-8 rounded-lg",
  };
  return h("button", {
    disabled,
    className: cn(base, variants[variant] || variants.default, sizes[size] || sizes.default, className),
    ...rest,
  }, children);
}

function Card({ className = "", children, ...rest }) {
  return h("div", {
    className: cn("rounded-2xl border border-stone-200 bg-white text-stone-950 shadow-sm", className),
    ...rest,
  }, children);
}

function CardHeader({ className = "", children, ...rest }) {
  return h("div", { className: cn("flex flex-col space-y-1.5 p-5", className), ...rest }, children);
}

function CardTitle({ className = "", children, ...rest }) {
  return h("h3", { className: cn("text-lg font-semibold tracking-tight", className), ...rest }, children);
}

function CardDescription({ className = "", children, ...rest }) {
  return h("p", { className: cn("text-sm text-stone-500", className), ...rest }, children);
}

function CardContent({ className = "", children, ...rest }) {
  return h("div", { className: cn("p-5 pt-0", className), ...rest }, children);
}

function Input({ className = "", ...rest }) {
  return h("input", {
    className: cn(
      "flex h-10 w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-sm text-stone-900 shadow-sm outline-none transition placeholder:text-stone-400 focus-visible:ring-2 focus-visible:ring-stone-300",
      className,
    ),
    ...rest,
  });
}

function Checkbox({ checked, disabled, onCheckedChange, className = "" }) {
  return h("button", {
    type: "button",
    role: "checkbox",
    "aria-checked": checked,
    disabled,
    className: cn(
      "peer h-4 w-4 shrink-0 rounded-[5px] border border-stone-300 bg-white shadow-sm outline-none ring-offset-white focus-visible:ring-2 focus-visible:ring-stone-300 disabled:cursor-not-allowed disabled:opacity-50",
      className,
    ),
    onClick: () => onCheckedChange && onCheckedChange(!checked),
    style: {
      display: "inline-flex",
      alignItems: "center",
      justifyContent: "center",
      padding: 0,
      cursor: disabled ? "not-allowed" : "pointer",
      borderColor: checked ? "#1c1917" : "#d6d3d1",
      backgroundColor: checked ? "#1c1917" : "#ffffff",
      color: checked ? "#ffffff" : "#1c1917",
    },
  }, checked ? h(Check, { stroke: "currentColor", strokeWidth: 3 }) : null);
}

/* ------------------------------------------------------------------ */
/* Helpers                                                              */
/* ------------------------------------------------------------------ */

function normalizeNotionIdLike(value) {
  const raw = String(value || "").trim();
  let candidateSource = raw;
  try {
    const parsed = new URL(raw);
    if (parsed.pathname) candidateSource = parsed.pathname;
  } catch {}
  const matches = candidateSource.match(
    /[0-9a-fA-F]{32}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/g,
  );
  const candidate = matches && matches.length ? matches[matches.length - 1] : raw;
  const collapsed = String(candidate || "").replace(/-/g, "").toLowerCase();
  if (/^[0-9a-f]{32}$/.test(collapsed)) {
    return [collapsed.slice(0, 8), collapsed.slice(8, 12), collapsed.slice(12, 16), collapsed.slice(16, 20), collapsed.slice(20)].join("-");
  }
  return raw;
}

function normalizeResourceType(value) {
  const t = String(value || "").trim().toLowerCase();
  return t === "database" ? "data_source" : t || "unknown";
}

function canHaveChildren(type) {
  const n = normalizeResourceType(type);
  return n === "page" || n === "data_source";
}

function resourceTypeRank(type) {
  if (type === "page") return 0;
  if (type === "data_source") return 1;
  return 2;
}

function compareResources(a, b) {
  const tr = resourceTypeRank(a.resource_type) - resourceTypeRank(b.resource_type);
  if (tr !== 0) return tr;
  const tc = String(a.title || "").localeCompare(String(b.title || ""), undefined, { sensitivity: "base" });
  if (tc !== 0) return tc;
  return String(a.resource_id || "").localeCompare(String(b.resource_id || ""));
}

function dedupSort(items) {
  const byId = new Map();
  for (const item of items) {
    if (!item || typeof item !== "object") continue;
    const rid = normalizeNotionIdLike(item.resource_id);
    if (!rid) continue;
    const norm = {
      ...item,
      resource_id: rid,
      resource_type: normalizeResourceType(item.resource_type),
      parent_id: normalizeNotionIdLike(item.parent_id),
      parent_database_id: normalizeNotionIdLike(item.parent_database_id),
      discovered_parent_id: normalizeNotionIdLike(item.discovered_parent_id),
      discovered_root_id: normalizeNotionIdLike(item.discovered_root_id),
    };
    byId.set(rid, { ...(byId.get(rid) || norm), ...norm });
  }
  return Array.from(byId.values()).sort(compareResources);
}

function formatTypeLabel(type) {
  if (type === "data_source") return "Data source";
  if (type === "page") return "Page";
  return String(type || "resource").replace(/_/g, " ");
}

function formatDate(value) {
  if (!value) return null;
  try {
    return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(new Date(value));
  } catch { return null; }
}

function matchesQuery(resource, query) {
  if (!query) return true;
  const hay = [resource.title, resource.resource_id, resource.resource_type, resource.parent_id, resource.parent_type, resource.parent_database_id, resource.resource_url];
  return hay.some((v) => String(v || "").toLowerCase().includes(query));
}

function resolvedParentId(r) {
  return normalizeNotionIdLike(r.discovered_parent_id || r.parent_id || r.parent_database_id);
}

function buildChildIndex(items) {
  const byId = new Map(items.map((i) => [i.resource_id, i]));
  const index = new Map();
  for (const item of items) {
    const pid = resolvedParentId(item);
    if (!pid || !byId.has(pid)) continue;
    const arr = index.get(pid) || [];
    arr.push(item);
    index.set(pid, arr);
  }
  for (const [k, v] of index.entries()) {
    index.set(k, [...v].sort(compareResources));
  }
  return index;
}

async function api(path) {
  const resp = await fetch(path, { headers: { "Content-Type": "application/json" } });
  const data = await resp.json().catch(() => ({ error: "Invalid JSON" }));
  if (!resp.ok) throw new Error(data.error || "HTTP " + resp.status);
  return data;
}

async function apiPost(path, body) {
  const resp = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await resp.json().catch(() => ({ error: "Invalid JSON" }));
  if (!resp.ok) throw new Error(data.error || "HTTP " + resp.status);
  return data;
}

/* ------------------------------------------------------------------ */
/* ResourceRow                                                          */
/* ------------------------------------------------------------------ */

function ResourceIcon({ resource }) {
  if (resource.icon_emoji) {
    return h("span", { className: "text-[13px] leading-none" }, resource.icon_emoji);
  }
  if (resource.resource_type === "data_source") {
    return h(Database, { className: "w-3.5 h-3.5 text-stone-500" });
  }
  return h(FileText, { className: "w-3.5 h-3.5 text-stone-500" });
}

function ResourceRow({
  resource, selectedState, loading, includesSubtree,
  canExpand, expanded, depth, disabled, onToggle, onToggleExpand,
}) {
  const selected = selectedState !== "none";

  return h("div", {
    "data-resource-id": resource.resource_id,
    "data-selected-state": selectedState,
    className: cn(
      "flex min-h-9 items-center gap-2 rounded-lg px-2 py-1.5 transition",
      selectedState === "explicit" ? "bg-stone-100"
        : selectedState === "descendant" ? "bg-stone-50"
        : "hover:bg-stone-50",
    ),
    style: { paddingLeft: (8 + depth * 18) + "px" },
    title: [resource.title || "Untitled", formatTypeLabel(resource.resource_type), resource.resource_id, formatDate(resource.last_edited_time) ? "Edited " + formatDate(resource.last_edited_time) : null].filter(Boolean).join("\n"),
  },
    canExpand
      ? h("button", {
          type: "button",
          className: "flex w-4 h-4 shrink-0 items-center justify-center rounded text-stone-500 hover:bg-stone-200/60 hover:text-stone-700",
          "aria-label": expanded ? "Collapse nested items" : "Expand nested items",
          onClick: () => onToggleExpand && onToggleExpand(resource),
        }, expanded ? h(ChevronDown, { className: "w-3.5 h-3.5" }) : h(ChevronRight, { className: "w-3.5 h-3.5" }))
      : h("span", { className: "w-4 shrink-0", "aria-hidden": "true" }),

    h(Checkbox, {
      checked: selected,
      disabled,
      onCheckedChange: (next) => onToggle && onToggle(resource, next),
    }),

    h("span", { className: "flex w-4 h-4 shrink-0 items-center justify-center" },
      h(ResourceIcon, { resource })),

    h("div", { className: "min-w-0 flex-1" },
      h("div", { className: "flex min-w-0 items-center gap-2" },
        h("span", { className: "truncate text-[13px] text-stone-900" }, resource.title || "Untitled"),
        h(Badge, { variant: "outline", className: "h-5 shrink-0 rounded-full px-2 text-[10px] text-stone-500" },
          resource.resource_type === "data_source" ? "Data source" : "Page"),
        selectedState === "explicit" && h(Badge, { variant: "outline", className: "h-5 shrink-0 rounded-full px-2 text-[10px]" }, "Selected"),
        selectedState === "explicit" && includesSubtree && h(Badge, { variant: "outline", className: "h-5 shrink-0 rounded-full px-2 text-[10px]" }, "Includes subtree"),
        selectedState === "descendant" && h(Badge, { variant: "outline", className: "h-5 shrink-0 rounded-full px-2 text-[10px]" }, "In selected subtree"),
      ),
    ),

    loading && h(LoaderCircle, { className: "w-3.5 h-3.5 shrink-0 text-stone-500" }),
  );
}

/* ------------------------------------------------------------------ */
/* Main App                                                             */
/* ------------------------------------------------------------------ */

function SelectionApp() {
  const [catalog, setCatalog] = useState([]);
  const [selectedRootIds, setSelectedRootIds] = useState(new Set());
  const [discoveredByRoot, setDiscoveredByRoot] = useState(new Map());
  const [loadingRootIds, setLoadingRootIds] = useState(new Set());
  const [collapsedIds, setCollapsedIds] = useState(new Set());
  const [inputValue, setInputValue] = useState("");
  const [refreshingCatalog, setRefreshingCatalog] = useState(false);
  const [searchingCatalog, setSearchingCatalog] = useState(false);
  const [remoteSearchIds, setRemoteSearchIds] = useState(new Set());
  const [catalogLoaded, setCatalogLoaded] = useState(false);
  const [bindStatus, setBindStatus] = useState("");
  const [savedBindingsPath, setSavedBindingsPath] = useState("");

  const deferredQuery = useDeferredValue(inputValue.trim().toLowerCase());

  const rootIndex = new Map(catalog.map((r) => [r.resource_id, r]));

  /* -- Load catalog ------------------------------------------------ */

  async function refreshCatalog() {
    setRefreshingCatalog(true);
    try {
      const params = new URLSearchParams();
      params.set("fetch_all", "true");
      const payload = await api("/api/search?" + params.toString());
      const results = dedupSort(payload.results || []);

      setCatalog((current) => {
        const selectedResources = Array.from(selectedRootIds)
          .map((id) => rootIndex.get(id))
          .filter(Boolean);
        const discovered = Array.from(discoveredByRoot.values()).flat();
        return dedupSort([...results, ...selectedResources, ...discovered]);
      });
      setCatalogLoaded(true);
    } catch (err) {
      console.error("Catalog refresh failed:", err);
    } finally {
      setRefreshingCatalog(false);
    }
  }

  useEffect(() => {
    if (!catalogLoaded) refreshCatalog();
  }, [catalogLoaded]);

  /* -- Remote search ----------------------------------------------- */

  useEffect(() => {
    if (!catalogLoaded) return;
    if (!deferredQuery) {
      setRemoteSearchIds(new Set());
      setSearchingCatalog(false);
      return;
    }
    setRemoteSearchIds(new Set());
    setSearchingCatalog(true);
    let cancelled = false;
    const tid = setTimeout(async () => {
      try {
        const params = new URLSearchParams();
        params.set("fetch_all", "true");
        params.set("query", deferredQuery);
        const payload = await api("/api/search?" + params.toString());
        if (cancelled) return;
        const results = dedupSort(payload.results || []);
        setCatalog((prev) => dedupSort([...prev, ...results]));
        setRemoteSearchIds(new Set(results.map((r) => r.resource_id)));
      } catch (err) {
        if (!cancelled) {
          console.error("Search failed:", err);
          setRemoteSearchIds(new Set());
        }
      } finally {
        if (!cancelled) setSearchingCatalog(false);
      }
    }, 250);
    return () => { cancelled = true; clearTimeout(tid); };
  }, [catalogLoaded, deferredQuery]);

  /* -- Children discovery ------------------------------------------ */

  async function ensureChildren(rootId, resourceType) {
    const nid = normalizeNotionIdLike(rootId);
    const ntype = normalizeResourceType(resourceType);
    if (!nid || (ntype !== "page" && ntype !== "data_source")) return;
    if (discoveredByRoot.has(nid) || loadingRootIds.has(nid)) return;

    setLoadingRootIds((s) => { const n = new Set(s); n.add(nid); return n; });
    try {
      const params = new URLSearchParams();
      params.set("resource_id_or_url", nid);
      params.set("resource_type", ntype);
      params.set("limit", "500");
      params.set("mode", "shallow");
      const payload = await api("/api/children?" + params.toString());
      const descendants = dedupSort(payload.results || []);
      setCatalog((prev) => dedupSort([...prev, ...descendants]));
      setDiscoveredByRoot((m) => { const n = new Map(m); n.set(nid, descendants); return n; });
    } catch {
      setDiscoveredByRoot((m) => { const n = new Map(m); n.set(nid, []); return n; });
    } finally {
      setLoadingRootIds((s) => { const n = new Set(s); n.delete(nid); return n; });
    }
  }

  /* -- Selection --------------------------------------------------- */

  function toggleSelection(resource, nextChecked) {
    const rid = normalizeNotionIdLike(resource.resource_id);
    if (!rid) return;
    setSelectedRootIds((s) => {
      const n = new Set(s);
      nextChecked ? n.add(rid) : n.delete(rid);
      return n;
    });
  }

  /* -- Tree logic -------------------------------------------------- */

  const childIndex = buildChildIndex(catalog);
  const parentIndex = new Map(catalog.map((r) => [r.resource_id, resolvedParentId(r)]));

  function collectDescendants(rootId) {
    const result = [];
    const children = childIndex.get(rootId) || [];
    for (const ch of children) { result.push(ch); result.push(...collectDescendants(ch.resource_id)); }
    return result;
  }

  const autoIncludedIds = new Set();
  for (const rootId of selectedRootIds) {
    for (const ch of collectDescendants(rootId)) {
      if (!selectedRootIds.has(ch.resource_id)) autoIncludedIds.add(ch.resource_id);
    }
  }

  const searchActive = Boolean(deferredQuery);
  const visibleIds = new Set(searchActive ? [] : catalog.map((r) => r.resource_id));
  for (const r of catalog) {
    if (selectedRootIds.has(r.resource_id) || autoIncludedIds.has(r.resource_id) ||
        (searchActive ? (remoteSearchIds.has(r.resource_id) || matchesQuery(r, deferredQuery)) : matchesQuery(r, deferredQuery))) {
      visibleIds.add(r.resource_id);
    }
  }
  for (const rid of Array.from(visibleIds)) {
    let pid = parentIndex.get(rid);
    while (pid && rootIndex.has(pid)) {
      if (visibleIds.has(pid)) { pid = parentIndex.get(pid); continue; }
      visibleIds.add(pid);
      pid = parentIndex.get(pid);
    }
  }

  function isExpanded(rid) {
    const hasKnownChildren = Boolean((childIndex.get(rid) || []).length);
    const hasBeenFetched = discoveredByRoot.has(rid);
    if (!hasKnownChildren && !hasBeenFetched) return false;
    if (searchActive) return !collapsedIds.has(rid);
    return !collapsedIds.has(rid);
  }

  async function toggleCollapsed(resource) {
    const rid = normalizeNotionIdLike(resource.resource_id);
    if (!rid) return;
    if (isExpanded(rid)) {
      setCollapsedIds((s) => { const n = new Set(s); n.add(rid); return n; });
      return;
    }
    setCollapsedIds((s) => { const n = new Set(s); n.delete(rid); return n; });
    if (canHaveChildren(resource.resource_type) && !discoveredByRoot.has(rid)) {
      await ensureChildren(rid, resource.resource_type);
    }
  }

  const rootResources = catalog
    .filter((r) => {
      if (!visibleIds.has(r.resource_id)) return false;
      const pid = parentIndex.get(r.resource_id);
      return !pid || !rootIndex.has(pid) || !visibleIds.has(pid);
    })
    .sort((a, b) => {
      const as = selectedRootIds.has(a.resource_id) ? 2 : autoIncludedIds.has(a.resource_id) ? 1 : 0;
      const bs = selectedRootIds.has(b.resource_id) ? 2 : autoIncludedIds.has(b.resource_id) ? 1 : 0;
      if (as !== bs) return bs - as;
      return compareResources(a, b);
    });

  const visibleRows = [];
  function appendRows(resource, depth) {
    if (!visibleIds.has(resource.resource_id)) return;
    visibleRows.push({ resource, depth });
    if (isExpanded(resource.resource_id)) {
      for (const ch of childIndex.get(resource.resource_id) || []) appendRows(ch, depth + 1);
    }
  }
  for (const r of rootResources) appendRows(r, 0);

  /* -- Bind -------------------------------------------------------- */

  const finalBundle = Array.from(selectedRootIds)
    .map((id) => rootIndex.get(id))
    .filter(Boolean)
    .map((r) => ({
      resource_id_or_url: r.resource_url || r.resource_id,
      resource_type: r.resource_type || null,
      title: r.title,
      selection_scope: "subtree",
    }));

  async function finishBinding() {
    if (!finalBundle.length) return;
    setBindStatus("binding");
    try {
      const payload = await apiPost("/api/bind", { resource_refs: finalBundle });
      setSavedBindingsPath(String(payload.bindings_path || ""));
      setBindStatus("success");
      setSelectedRootIds(new Set());
      setTimeout(() => {
        apiPost("/api/shutdown", {}).catch(() => {});
      }, 250);
    } catch (err) {
      setSavedBindingsPath("");
      setBindStatus("error: " + err.message);
    }
  }

  /* -- Render ------------------------------------------------------ */

  const workspaceLabel = config.workspace_name || config.project_root || "workspace";
  const catalogNotice = "Search queries run against Notion search for the shared workspace. If something is missing, share it with the integration in Notion first, then click Refresh.";

  return h("div", { className: "mx-auto min-h-screen w-full max-w-3xl px-3 py-6 sm:px-5 sm:py-8" },
    h("div", { className: "space-y-4 pb-28" },

      /* Title section */
      h("div", { className: "space-y-1" },
        h("h1", { className: "max-w-2xl text-xl font-semibold tracking-tight text-stone-950 sm:text-2xl" },
          "Choose Notion Content"),
        h("p", { className: "text-sm text-stone-500" },
          "Pick the pages and data sources from ", workspaceLabel,
          " that this project should be allowed to use."),
      ),

      /* Main card */
      h(Card, { className: "border-stone-200 shadow-sm" },
        h(CardHeader, { className: "gap-3" },
          h("div", { className: "flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between" },
            h("div", { className: "space-y-1" },
              h(CardTitle, { className: "text-base" }, "Select Pages and Data Sources"),
              h(CardDescription, null,
                "Selecting a root binds that page or data source with subtree scope. Expand rows to inspect nested content on demand."),
            ),
            h(Button, {
              variant: "secondary", size: "sm",
              disabled: refreshingCatalog,
              onClick: () => refreshCatalog(),
            },
              h(RefreshCw, { className: cn("w-3.5 h-3.5", refreshingCatalog && "animate-spin") }),
              "Refresh"),
          ),
          h("div", { className: "flex flex-col gap-2 sm:flex-row sm:items-center" },
            h("div", { className: "relative flex-1" },
              h(Search, { className: "pointer-events-none absolute left-3 top-1/2 w-4 h-4 -translate-y-1/2 text-stone-400" }),
              h(Input, {
                value: inputValue,
                onChange: (e) => { startTransition(() => { setInputValue(e.target.value); }); },
                className: "pl-9",
                placeholder: "Search workspace by title, type, or ID",
              }),
            ),
          ),
          h("div", { className: "rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-sm leading-6 text-amber-900" },
            catalogNotice),
        ),
        h(CardContent, null,
          !catalogLoaded && refreshingCatalog
            ? h("div", { className: "rounded-xl border border-dashed border-stone-200 bg-stone-50 px-4 py-10 text-center text-sm text-stone-500" },
                "Loading available pages and data sources...")
            : visibleRows.length
              ? h("div", { className: "space-y-2" },
                  visibleRows.map(({ resource, depth }) => {
                    const ss = selectedRootIds.has(resource.resource_id) ? "explicit"
                      : autoIncludedIds.has(resource.resource_id) ? "descendant" : "none";
                    const hasChildren = Boolean((childIndex.get(resource.resource_id) || []).length);
                    const ce = hasChildren || loadingRootIds.has(resource.resource_id) ||
                      (canHaveChildren(resource.resource_type) && !discoveredByRoot.has(resource.resource_id));
                    return h(ResourceRow, {
                      key: resource.resource_id,
                      resource,
                      selectedState: ss,
                      loading: loadingRootIds.has(resource.resource_id),
                      includesSubtree: ss === "explicit" && canHaveChildren(resource.resource_type),
                      canExpand: ce,
                      expanded: isExpanded(resource.resource_id),
                      depth,
                      disabled: ss === "descendant",
                      onToggle: toggleSelection,
                      onToggleExpand: toggleCollapsed,
                    });
                  }))
              : h("div", { className: "rounded-xl border border-dashed border-stone-200 bg-stone-50 px-4 py-10 text-center text-sm text-stone-500" },
                  "No pages or data sources matched this filter."),
        ),
      ),
    ),

    /* Sticky bottom bar */
    h("div", { className: "sticky bottom-3 z-20" },
      h(Card, { className: "border-stone-200 bg-white/95 shadow-lg backdrop-blur" },
        h(CardContent, { className: "flex items-center justify-between gap-3 pt-5" },
          h("div", { className: "min-w-0" },
            h("p", { className: "text-sm text-stone-500" },
              searchingCatalog ? "Searching Notion..."
                : loadingRootIds.size ? "Loading nested content..."
                : bindStatus === "binding" ? "Binding resources..."
                : bindStatus === "success"
                  ? (savedBindingsPath
                      ? "Bindings saved to " + savedBindingsPath + "."
                      : "Bindings saved successfully.")
                : bindStatus.startsWith("error") ? bindStatus
                : finalBundle.length + " root" + (finalBundle.length === 1 ? "" : "s") + " selected"),
          ),
          h(Button, {
            disabled: !finalBundle.length || bindStatus === "binding",
            onClick: () => finishBinding(),
          }, "Connect Selected"),
        ),
      ),
    ),
  );
}

/* ------------------------------------------------------------------ */
/* Mount                                                                */
/* ------------------------------------------------------------------ */

ReactDOM.createRoot(document.getElementById("root")).render(h(SelectionApp));
    </script>
  </body>
</html>
