<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Labbook Binding Chooser</title>
    <style>
      :root {
        --bg: #faf7f2;
        --paper: #fffdf9;
        --ink: #1a1410;
        --muted: #6b5e52;
        --line: #e6ddd2;
        --accent: #c4532d;
        --accent-hover: #a8432a;
        --ok: #17643d;
        --error: #9d2f2f;
        --focus-ring: rgba(196, 83, 45, 0.45);
        --radius-sm: 14px;
        --radius-lg: 22px;
        --radius-pill: 999px;
        --shadow-card: 0 20px 60px rgba(26, 20, 16, 0.05);
        --transition: 0.15s ease;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(
            circle at top left,
            rgba(196, 83, 45, 0.1),
            transparent 30%
          ),
          linear-gradient(180deg, #fffaf5, var(--bg));
        min-height: 100vh;
      }

      /* Focus ring */
      :focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }

      .shell {
        max-width: 1240px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      /* Hero ------------------------------------------------------------ */
      .hero {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: flex-end;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        font-family: "DM Serif Display", "Noto Serif SC", "Noto Serif TC",
          serif;
        line-height: 1;
      }
      .subtle {
        color: var(--muted);
        margin-top: 10px;
        max-width: 64ch;
      }
      .workspace {
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.8);
        color: var(--muted);
        font-size: 0.95rem;
        white-space: nowrap;
      }

      /* Recommendation card ---------------------------------------------- */
      .recommendation {
        margin-bottom: 18px;
        border: 1px solid #e5c7b8;
        background: linear-gradient(180deg, #fffaf4, #fff6ef);
      }
      .recommendation strong {
        display: block;
        margin-bottom: 8px;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }
      .option {
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: #fff;
        padding: 10px 12px;
        min-width: 180px;
        flex: 1 1 220px;
        transition: box-shadow var(--transition);
      }
      .option:hover {
        box-shadow: 0 2px 8px rgba(26, 20, 16, 0.08);
      }
      .option-title {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .option-title .recommended {
        margin-left: 6px;
        color: var(--accent);
      }

      /* Layout ----------------------------------------------------------- */
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(320px, 0.9fr);
        gap: 20px;
      }
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 18px;
        box-shadow: var(--shadow-card);
      }

      /* Controls --------------------------------------------------------- */
      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 12px;
        margin-bottom: 16px;
      }
      input[type="search"],
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        font: inherit;
        color: var(--ink);
        background: #fff;
        transition: border-color var(--transition);
      }
      input[type="search"]:focus,
      textarea:focus,
      select:focus {
        border-color: var(--accent);
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      button {
        border: 0;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 12px 16px;
        cursor: pointer;
        transition: background var(--transition), transform 0.1s ease;
      }
      button:active:not(:disabled) {
        transform: scale(0.97);
      }
      button.secondary {
        background: #efe5da;
        color: var(--ink);
      }
      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      button.secondary:hover:not(:disabled) {
        background: #e6d7c7;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Section titles --------------------------------------------------- */
      .section-title {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }

      /* Result list ------------------------------------------------------ */
      .list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .item {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        padding: 12px;
        transition: box-shadow var(--transition);
      }
      .item:hover {
        box-shadow: 0 2px 12px rgba(26, 20, 16, 0.06);
      }
      .item-head {
        display: grid;
        grid-template-columns: auto auto 1fr auto auto;
        gap: 10px;
        align-items: start;
      }
      .depth {
        display: inline-flex;
        width: 1.25rem;
        justify-content: center;
        color: var(--muted);
      }
      .title {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .meta {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .crumb {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 4px;
        flex-wrap: wrap;
      }
      .crumb span {
        border-radius: var(--radius-pill);
        background: #f3eee8;
        padding: 4px 8px;
      }
      .children {
        margin-top: 10px;
        padding-left: 22px;
        border-left: 1px dashed var(--line);
      }

      /* Toolbar / pill --------------------------------------------------- */
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: var(--radius-pill);
        background: #f2ebe3;
        color: var(--muted);
        font-size: 0.9rem;
      }

      /* Selected / bindings ---------------------------------------------- */
      .selected-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }
      .selected-item {
        display: grid;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 12px;
        background: #fff;
        transition: box-shadow var(--transition);
      }
      .selected-item:hover {
        box-shadow: 0 2px 8px rgba(26, 20, 16, 0.06);
      }
      .hint,
      .empty {
        color: var(--muted);
        font-size: 0.95rem;
      }
      .status {
        min-height: 24px;
        color: var(--muted);
        margin-top: 8px;
        transition: color var(--transition);
      }
      .ok {
        color: var(--ok);
      }
      .error {
        color: var(--error);
      }
      a {
        color: var(--accent);
      }

      /* Animations ------------------------------------------------------- */
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .item,
      .selected-item {
        animation: fade-in 0.15s ease both;
      }

      /* Responsive ------------------------------------------------------- */
      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .hero {
          flex-direction: column;
          align-items: start;
        }
        .controls {
          grid-template-columns: 1fr;
        }
        .item-head {
          grid-template-columns: auto 1fr;
        }
      }
    </style>
  </head>

        bindings: [],
        loading: false,
        message: "",
        messageClass: "",
        searchTimer: null,
        filter: "all",
        hideBound: false,
        childMeta: new Map(),
        deepLoading: new Set(),
      };

      /* ----------------------------------------------------------------
       * Helpers
       * -------------------------------------------------------------- */
      function $(id) {
        return document.getElementById(id);
      }

      function api(path, options = {}) {
        return fetch(path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        }).then(async (response) => {
          const payload = await response
            .json()
            .catch(() => ({ error: "Invalid JSON response." }));
          if (!response.ok)
            throw new Error(payload.error || `HTTP ${response.status}`);
          return payload;
        });
      }

      function parsePastedUrls() {
        const textarea = $("url-input");
        if (!textarea) return [];
        const scope = ($("url-scope") || {}).value || "subtree";
        return textarea.value
          .split(/\n+/)
          .map((line) => line.trim())
          .filter(Boolean)
          .map((url) => ({
            key: `url:${url}`,
            title: url,
            resource_id_or_url: url,
            resource_type: null,
            selection_scope: scope,
            isUrl: true,
          }));
      }

      function describeParent(item) {
        const parent = item.parent || null;
        if (!parent || typeof parent !== "object") return "";
        if (parent.type === "workspace") return "workspace";
        if (parent.type === "page_id" && parent.page_id)
          return `page \u00b7 ${parent.page_id}`;
        if (parent.type === "data_source_id" && parent.data_source_id)
          return `data source \u00b7 ${parent.data_source_id}`;
        if (parent.type === "database_id" && parent.database_id)
          return `database \u00b7 ${parent.database_id}`;
        return parent.type || "";
      }

      function isRootLike(item) {
        const parent = item.parent || null;
        return !parent || parent.type === "workspace";
      }

      function isBound(item) {
        return state.bindings.some(
          (binding) => binding.resource_id === item.resource_id
        );
      }

      function mergeByResourceId(existingItems, nextItems) {
        const byId = new Map();
        for (const item of existingItems || []) byId.set(item.resource_id, item);
        for (const item of nextItems || []) byId.set(item.resource_id, item);
        return Array.from(byId.values());
      }

      /* ----------------------------------------------------------------
       * Selection
       * -------------------------------------------------------------- */
      function toggleSelection(item) {
        const key = item.key || item.resource_id;
        if (state.selected.has(key)) {
          state.selected.delete(key);
        } else {
          state.selected.set(key, {
            resource_id_or_url:
              item.resource_url || item.resource_id_or_url || item.resource_id,
            resource_type: item.resource_type || null,
            title: item.title,
            selection_scope: item.selection_scope || "subtree",
            isUrl: Boolean(item.isUrl),
          });
        }
        renderDynamic();
      }

      function updateSelectedScope(key, scope) {
        const sel = state.selected.get(key);
        if (!sel) return;
        sel.selection_scope = scope;
        renderDynamic();
      }

      /* ----------------------------------------------------------------
       * Data loading
       * -------------------------------------------------------------- */
      function scheduleSearch() {
        if (state.searchTimer) clearTimeout(state.searchTimer);
        state.searchTimer = setTimeout(loadCatalog, 250);
      }

      async function loadBindings() {
        const payload = await api("/api/bindings");
        state.bindings = payload.resources || [];
        renderDynamic();
      }

      async function loadCatalog() {
        state.loading = true;
        renderDynamic();
        try {
          const params = new URLSearchParams();
          params.set("page_size", String(config.page_size));
          if (state.query.trim()) params.set("query", state.query.trim());
          const payload = await api(`/api/search?${params.toString()}`);
          state.catalog = payload.results || [];
          state.message = "";
          state.messageClass = "";
        } catch (error) {
          state.message = String(error.message || error);
          state.messageClass = "error";
        } finally {
          state.loading = false;
          renderDynamic();
        }
      }

      async function toggleExpand(item) {
        const key = item.resource_id;
        if (state.expanded.has(key)) {
          state.expanded.delete(key);
          renderDynamic();
          return;
        }
        if (!state.children.has(key)) {
          state.loading = true;
          renderDynamic();
          try {
            const params = new URLSearchParams();
            params.set(
              "resource_id_or_url",
              item.resource_url || item.resource_id
            );
            params.set("resource_type", item.resource_type);
            params.set("limit", "50");
            params.set("mode", "shallow");
            const payload = await api(`/api/children?${params.toString()}`);
            state.children.set(key, payload.results || []);
            state.childMeta.set(key, {
              partial: Boolean(payload.partial),
              mode: payload.mode || "shallow",
            });
          } catch (error) {
            state.message = String(error.message || error);
            state.messageClass = "error";
          } finally {
            state.loading = false;
          }
        }
        state.expanded.add(key);
        renderDynamic();
      }

      async function scanDeeper(item) {
        const key = item.resource_id;
        state.deepLoading.add(key);
        renderDynamic();
        try {
          const params = new URLSearchParams();
          params.set(
            "resource_id_or_url",
            item.resource_url || item.resource_id
          );
          params.set("resource_type", item.resource_type);
          params.set("limit", "50");
          params.set("mode", "deep");
          const payload = await api(`/api/children?${params.toString()}`);
          const previous = state.children.get(key) || [];
          const merged = mergeByResourceId(previous, payload.results || []);
          state.children.set(key, merged);
          state.childMeta.set(key, {
            partial: Boolean(payload.partial),
            mode: payload.mode || "deep",
            addedCount: Math.max(0, merged.length - previous.length),
          });
        } catch (error) {
          state.message = String(error.message || error);
          state.messageClass = "error";
        } finally {
          state.deepLoading.delete(key);
          renderDynamic();
        }
      }

      async function bindSelected() {
        const resourceRefs = [
          ...Array.from(state.selected.values()).map((item) => ({
            resource_id_or_url: item.resource_id_or_url,
            resource_type: item.resource_type,
            title: item.isUrl ? undefined : item.title,
            selection_scope: item.selection_scope,
          })),
          ...parsePastedUrls().map((item) => ({
            resource_id_or_url: item.resource_id_or_url,
            selection_scope: item.selection_scope,
          })),
        ];
        if (!resourceRefs.length) {
          state.message = t.noSelection;
          state.messageClass = "error";
          renderDynamic();
          return;
        }

        state.loading = true;
        renderDynamic();
        try {
          await api("/api/bind", {
            method: "POST",
            body: JSON.stringify({ resource_refs: resourceRefs }),
          });
          state.message = t.bindingSuccess;
          state.messageClass = "ok";
          state.selected.clear();
          const urlInput = $("url-input");
          if (urlInput) urlInput.value = "";
          await loadBindings();
        } catch (error) {
          state.message = String(error.message || error);
          state.messageClass = "error";
        } finally {
          state.loading = false;
          renderDynamic();
        }
      }

      /* ----------------------------------------------------------------
       * DOM builders (result nodes)
       * -------------------------------------------------------------- */
      function renderNode(item, depth = 0) {
        const key = item.resource_id;
        const children = state.children.get(key) || [];
        const selected = state.selected.get(key);
        const wrapper = document.createElement("div");
        wrapper.className = "item";
        wrapper.setAttribute("role", "treeitem");
        wrapper.setAttribute(
          "aria-expanded",
          state.expanded.has(key) ? "true" : "false"
        );

        const head = document.createElement("div");
        head.className = "item-head";

        const depthEl = document.createElement("div");
        depthEl.className = "depth";
        depthEl.textContent = depth ? "\u2514" : "";
        depthEl.setAttribute("aria-hidden", "true");
        head.appendChild(depthEl);

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = Boolean(selected);
        checkbox.setAttribute(
          "aria-label",
          `Select ${item.title || item.resource_id}`
        );
        checkbox.addEventListener("change", () => toggleSelection(item));
        head.appendChild(checkbox);

        const body = document.createElement("div");

        const titleEl = document.createElement("div");
        titleEl.className = "title";
        titleEl.textContent = item.title;
        body.appendChild(titleEl);

        const crumb = document.createElement("div");
        crumb.className = "crumb";
        const typeChip = document.createElement("span");
        typeChip.textContent = t[item.resource_type] || item.resource_type;
        crumb.appendChild(typeChip);
        if (isRootLike(item)) {
          const rootChip = document.createElement("span");
          rootChip.textContent = t.filter_roots;
          crumb.appendChild(rootChip);
        }
        if (isBound(item)) {
          const boundChip = document.createElement("span");
          boundChip.textContent = t.boundBadge;
          crumb.appendChild(boundChip);
        }
        body.appendChild(crumb);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${t[item.resource_type] || item.resource_type} \u00b7 ${item.resource_id}`;
        body.appendChild(meta);

        const parentText = describeParent(item);
        if (parentText || item.last_edited_time) {
          const details = document.createElement("div");
          details.className = "meta";
          details.textContent = [parentText, item.last_edited_time]
            .filter(Boolean)
            .join(" \u00b7 ");
          body.appendChild(details);
        }
        if (item.resource_url) {
          const link = document.createElement("a");
          link.href = item.resource_url;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = item.resource_url;
          body.appendChild(link);
        }
        head.appendChild(body);

        const scope = document.createElement("select");
        scope.setAttribute("aria-label", `${t.selectionScope} for ${item.title || item.resource_id}`);
        for (const [val, label] of [
          ["resource", t.resource],
          ["subtree", t.subtree],
        ]) {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = label;
          scope.appendChild(opt);
        }
        scope.value = selected?.selection_scope || "subtree";
        scope.addEventListener("change", (event) => {
          if (!selected) toggleSelection(item);
          updateSelectedScope(key, event.target.value);
        });
        head.appendChild(scope);

        const expandBtn = document.createElement("button");
        expandBtn.className = "secondary";
        expandBtn.textContent = state.expanded.has(key) ? t.collapse : t.expand;
        expandBtn.setAttribute(
          "aria-label",
          `${state.expanded.has(key) ? t.collapse : t.expand} ${item.title || item.resource_id}`
        );
        expandBtn.addEventListener("click", () => toggleExpand(item));
        head.appendChild(expandBtn);

        wrapper.appendChild(head);

        if (state.expanded.has(key)) {
          const childWrap = document.createElement("div");
          childWrap.className = "children";
          childWrap.setAttribute("role", "group");
          const childMeta = state.childMeta.get(key) || {
            partial: false,
            mode: "shallow",
          };
          if (!children.length) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = t.noResults;
            childWrap.appendChild(empty);
          } else {
            for (const child of children) {
              childWrap.appendChild(renderNode(child, depth + 1));
            }
          }
          if (childMeta.partial && childMeta.mode !== "deep") {
            const partial = document.createElement("div");
            partial.className = "toolbar";
            const hint = document.createElement("div");
            hint.className = "hint";
            hint.textContent = t.partialChildren;
            partial.appendChild(hint);
            const deeper = document.createElement("button");
            deeper.className = "secondary";
            deeper.textContent = state.deepLoading.has(key)
              ? t.scanningDeeper
              : t.scanDeeper;
            deeper.disabled = state.deepLoading.has(key);
            deeper.addEventListener("click", () => scanDeeper(item));
            partial.appendChild(deeper);
            childWrap.appendChild(partial);
          } else if (childMeta.mode === "deep") {
            const partial = document.createElement("div");
            partial.className = "hint";
            partial.textContent = childMeta.addedCount
              ? t.addedMore(childMeta.addedCount)
              : t.noAdditional;
            childWrap.appendChild(partial);
          }
          wrapper.appendChild(childWrap);
        }

        return wrapper;
      }

      /* ----------------------------------------------------------------
       * Rendering: static shell + dynamic regions
       *
       * The shell (hero, recommendation, layout skeleton) is rendered
       * once.  Only the dynamic content regions (results, selected,
       * bindings, status) are re-rendered on state changes.  This
       * preserves input focus and scroll position.
       * -------------------------------------------------------------- */
      let shellRendered = false;

      function renderShell() {
        if (shellRendered) return;
        shellRendered = true;

        const app = $("app");
        app.innerHTML = "";

        /* Hero -------------------------------------------------------- */
        const hero = document.createElement("div");
        hero.className = "hero";

        const heroLeft = document.createElement("div");
        const heroPill = document.createElement("div");
        heroPill.className = "pill";
        heroPill.textContent = t.chooser;
        heroLeft.appendChild(heroPill);

        const heroTitle = document.createElement("h1");
        heroTitle.textContent = t.title;
        heroLeft.appendChild(heroTitle);

        const heroSubtitle = document.createElement("div");
        heroSubtitle.className = "subtle";
        heroSubtitle.textContent = t.subtitle;
        heroLeft.appendChild(heroSubtitle);
        hero.appendChild(heroLeft);

        const heroWorkspace = document.createElement("div");
        heroWorkspace.className = "workspace";
        heroWorkspace.textContent = `${t.workspace}: ${config.workspace_name || config.project_root}`;
        hero.appendChild(heroWorkspace);
        app.appendChild(hero);

        /* Recommendation ----------------------------------------------- */
        const recommendation = document.createElement("div");
        recommendation.className = "card recommendation";
        const bindingRecommendation = config.binding_recommendation || null;
        const bindingOptions = Array.isArray(config.binding_options)
          ? config.binding_options
          : [];

        const recTitle = document.createElement("strong");
        recTitle.textContent = t.recommendationTitle;
        recommendation.appendChild(recTitle);

        const recReason = document.createElement("div");
        recReason.className = "subtle";
        recReason.textContent =
          bindingRecommendation?.reason || t.recommendationFallback;
        recommendation.appendChild(recReason);

        const recQuestion = document.createElement("div");
        recQuestion.className = "hint";
        const recQuestionLabel = document.createElement("strong");
        recQuestionLabel.textContent = t.recommendationQuestion + ": ";
        recQuestion.appendChild(recQuestionLabel);
        recQuestion.appendChild(
          document.createTextNode(
            config.binding_question || t.recommendationQuestionFallback
          )
        );
        recommendation.appendChild(recQuestion);

        const optionsWrap = document.createElement("div");
        optionsWrap.className = "options";
        for (const option of bindingOptions) {
          const node = document.createElement("div");
          node.className = "option";
          const modeLabel =
            t.recommendationModes?.[option.mode] ||
            option.label ||
            option.mode;
          const optTitle = document.createElement("div");
          optTitle.className = "option-title";
          optTitle.textContent = modeLabel;
          if (option.recommended) {
            const recBadge = document.createElement("span");
            recBadge.className = "recommended";
            recBadge.textContent = "Recommended";
            optTitle.appendChild(document.createTextNode(" "));
            optTitle.appendChild(recBadge);
          }
          node.appendChild(optTitle);
          const optMeta = document.createElement("div");
          optMeta.className = "meta";
          optMeta.textContent = option.reason;
          node.appendChild(optMeta);
          optionsWrap.appendChild(node);
        }
        recommendation.appendChild(optionsWrap);
        app.appendChild(recommendation);

        /* Layout grid -------------------------------------------------- */
        const layout = document.createElement("div");
        layout.className = "layout";

        /* Left card ---------------------------------------------------- */
        const left = document.createElement("div");
        left.className = "card";

        const leftToolbar = document.createElement("div");
        leftToolbar.className = "toolbar";
        const projectPill = document.createElement("div");
        projectPill.className = "pill";
        projectPill.textContent = config.project_root;
        leftToolbar.appendChild(projectPill);

        const countPill = document.createElement("div");
        countPill.className = "pill";
        countPill.id = "count-pill";
        countPill.textContent = "0 results";
        leftToolbar.appendChild(countPill);

        const hideBoundLabel = document.createElement("label");
        hideBoundLabel.className = "pill";
        const hideBoundCheckbox = document.createElement("input");
        hideBoundCheckbox.id = "hide-bound";
        hideBoundCheckbox.type = "checkbox";
        hideBoundCheckbox.checked = state.hideBound;
        hideBoundCheckbox.addEventListener("change", (event) => {
          state.hideBound = Boolean(event.target.checked);
          renderDynamic();
        });
        hideBoundLabel.appendChild(hideBoundCheckbox);
        hideBoundLabel.appendChild(
          document.createTextNode(" " + t.filter_unbound)
        );
        leftToolbar.appendChild(hideBoundLabel);
        left.appendChild(leftToolbar);

        const controls = document.createElement("div");
        controls.className = "controls";
        const searchInput = document.createElement("input");
        searchInput.id = "search";
        searchInput.type = "search";
        searchInput.placeholder = t.searchPlaceholder;
        searchInput.value = state.query;
        searchInput.setAttribute("aria-label", t.searchPlaceholder);
        searchInput.addEventListener("input", (event) => {
          state.query = event.target.value;
          scheduleSearch();
        });
        searchInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            loadCatalog();
          }
        });
        controls.appendChild(searchInput);

        const filterSelect = document.createElement("select");
        filterSelect.id = "filter";
        filterSelect.setAttribute("aria-label", t.filters);
        for (const [val, label] of [
          ["all", t.filter_all],
          ["pages", t.filter_pages],
          ["data_sources", t.filter_data_sources],
          ["roots", t.filter_roots],
        ]) {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = label;
          filterSelect.appendChild(opt);
        }
        filterSelect.value = state.filter;
        filterSelect.addEventListener("change", (event) => {
          state.filter = event.target.value;
          renderDynamic();
        });
        controls.appendChild(filterSelect);

        const searchButton = document.createElement("button");
        searchButton.textContent = t.refresh;
        searchButton.addEventListener("click", () => loadCatalog());
        controls.appendChild(searchButton);

        const bindingsButton = document.createElement("button");
        bindingsButton.className = "secondary";
        bindingsButton.textContent = t.reloadBindings;
        bindingsButton.addEventListener("click", () => loadBindings());
        controls.appendChild(bindingsButton);
        left.appendChild(controls);

        const availableTitle = document.createElement("h2");
        availableTitle.className = "section-title";
        availableTitle.textContent = t.available;
        left.appendChild(availableTitle);

        const resultsDiv = document.createElement("div");
        resultsDiv.id = "results";
        resultsDiv.className = "list";
        resultsDiv.setAttribute("role", "tree");
        resultsDiv.setAttribute("aria-label", t.available);
        left.appendChild(resultsDiv);
        layout.appendChild(left);

        /* Right card --------------------------------------------------- */
        const right = document.createElement("div");
        right.className = "card";

        const selectedTitle = document.createElement("h2");
        selectedTitle.className = "section-title";
        selectedTitle.textContent = t.selected;
        right.appendChild(selectedTitle);
        const selectedDiv = document.createElement("div");
        selectedDiv.id = "selected";
        selectedDiv.className = "selected-list";
        selectedDiv.setAttribute("aria-label", t.selected);
        right.appendChild(selectedDiv);

        const pastedTitle = document.createElement("h2");
        pastedTitle.className = "section-title";
        pastedTitle.textContent = t.pastedUrls;
        right.appendChild(pastedTitle);
        const pastedHint = document.createElement("div");
        pastedHint.className = "hint";
        pastedHint.textContent = t.pastedUrlsHint;
        right.appendChild(pastedHint);

        const urlTextarea = document.createElement("textarea");
        urlTextarea.id = "url-input";
        urlTextarea.spellcheck = false;
        urlTextarea.setAttribute("aria-label", t.pastedUrls);
        right.appendChild(urlTextarea);

        const urlToolbar = document.createElement("div");
        urlToolbar.className = "toolbar";
        const urlScopeLabel = document.createElement("label");
        urlScopeLabel.className = "pill";
        urlScopeLabel.textContent = t.selectionScope + " ";
        const urlScopeSelect = document.createElement("select");
        urlScopeSelect.id = "url-scope";
        for (const [val, label] of [
          ["subtree", t.subtree],
          ["resource", t.resource],
        ]) {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = label;
          urlScopeSelect.appendChild(opt);
        }
        urlScopeLabel.appendChild(urlScopeSelect);
        urlToolbar.appendChild(urlScopeLabel);
        right.appendChild(urlToolbar);

        const bindButton = document.createElement("button");
        bindButton.id = "bind-button";
        bindButton.textContent = t.bindSelected;
        bindButton.addEventListener("click", () => bindSelected());
        right.appendChild(bindButton);

        const statusDiv = document.createElement("div");
        statusDiv.id = "status";
        statusDiv.className = "status";
        right.appendChild(statusDiv);

        const boundTitle = document.createElement("h2");
        boundTitle.className = "section-title";
        boundTitle.textContent = t.bound;
        right.appendChild(boundTitle);
        const bindingsDiv = document.createElement("div");
        bindingsDiv.id = "bindings";
        bindingsDiv.className = "selected-list";
        bindingsDiv.setAttribute("aria-label", t.bound);
        right.appendChild(bindingsDiv);

        layout.appendChild(right);
        app.appendChild(layout);
      }

      /* ----------------------------------------------------------------
       * renderDynamic — update only the mutable regions
       * -------------------------------------------------------------- */
      function renderDynamic() {
        renderShell();

        /* Count pill --------------------------------------------------- */
        const countPill = $("count-pill");
        if (countPill) {
          const count = state.catalog.length;
          countPill.textContent = `${count} result${count === 1 ? "" : "s"}`;
        }

        /* Status ------------------------------------------------------- */
        const statusDiv = $("status");
        if (statusDiv) {
          statusDiv.className = `status ${state.messageClass}`;
          statusDiv.textContent = state.loading ? t.loading : state.message;
        }

        /* Results ------------------------------------------------------ */
        const results = $("results");
        if (results) {
          results.innerHTML = "";
          let visibleCatalog = state.catalog;
          if (state.hideBound) {
            visibleCatalog = visibleCatalog.filter((item) => !isBound(item));
          }
          if (state.filter === "pages") {
            visibleCatalog = visibleCatalog.filter(
              (item) => item.resource_type === "page"
            );
          } else if (state.filter === "data_sources") {
            visibleCatalog = visibleCatalog.filter(
              (item) => item.resource_type === "data_source"
            );
          } else if (state.filter === "roots") {
            visibleCatalog = visibleCatalog.filter((item) => isRootLike(item));
          }
          if (!visibleCatalog.length) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = state.loading ? t.loading : t.noResults;
            results.appendChild(empty);
          } else {
            const suggestedRoots = visibleCatalog.filter((item) =>
              isRootLike(item)
            );
            const remainingMatches = visibleCatalog.filter(
              (item) => !isRootLike(item)
            );

            if (suggestedRoots.length) {
              const section = document.createElement("div");
              section.className = "list";
              const heading = document.createElement("div");
              heading.className = "pill";
              heading.textContent = `${t.suggestedRoots} \u00b7 ${suggestedRoots.length}`;
              section.appendChild(heading);
              for (const item of suggestedRoots) {
                section.appendChild(renderNode(item));
              }
              results.appendChild(section);
            }

            if (remainingMatches.length) {
              const grouped = new Map();
              for (const item of remainingMatches) {
                const key = item.resource_type || "other";
                if (!grouped.has(key)) grouped.set(key, []);
                grouped.get(key).push(item);
              }
              for (const [type, items] of grouped.entries()) {
                const section = document.createElement("div");
                section.className = "list";
                const heading = document.createElement("div");
                heading.className = "pill";
                heading.textContent = `${t.moreMatches} \u00b7 ${t[type] || type} \u00b7 ${items.length}`;
                section.appendChild(heading);
                for (const item of items) {
                  section.appendChild(renderNode(item));
                }
                results.appendChild(section);
              }
            }
          }
        }

        /* Selected ----------------------------------------------------- */
        const selectedDiv = $("selected");
        if (selectedDiv) {
          selectedDiv.innerHTML = "";
          if (!state.selected.size) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = t.noSelection;
            selectedDiv.appendChild(empty);
          } else {
            for (const [key, item] of state.selected.entries()) {
              const node = document.createElement("div");
              node.className = "selected-item";
              const titleEl = document.createElement("strong");
              titleEl.textContent = item.title || item.resource_id_or_url;
              node.appendChild(titleEl);
              const metaEl = document.createElement("div");
              metaEl.className = "meta";
              metaEl.textContent = item.resource_type || "url";
              node.appendChild(metaEl);
              const scope = document.createElement("select");
              scope.setAttribute("aria-label", `${t.selectionScope} for ${item.title || key}`);
              for (const [val, label] of [
                ["resource", t.resource],
                ["subtree", t.subtree],
              ]) {
                const opt = document.createElement("option");
                opt.value = val;
                opt.textContent = label;
                scope.appendChild(opt);
              }
              scope.value = item.selection_scope;
              scope.addEventListener("change", (event) =>
                updateSelectedScope(key, event.target.value)
              );
              node.appendChild(scope);
              selectedDiv.appendChild(node);
            }
          }
        }

        /* Bindings ----------------------------------------------------- */
        const bindingsDiv = $("bindings");
        if (bindingsDiv) {
          bindingsDiv.innerHTML = "";
          if (!state.bindings.length) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = t.noBindings;
            bindingsDiv.appendChild(empty);
          } else {
            for (const item of state.bindings) {
              const node = document.createElement("div");
              node.className = "selected-item";
              const titleEl = document.createElement("strong");
              titleEl.textContent = item.title;
              node.appendChild(titleEl);
              const metaEl = document.createElement("div");
              metaEl.className = "meta";
              metaEl.textContent = `${item.resource_type} \u00b7 ${item.selection_scope} \u00b7 ${item.alias}`;
              node.appendChild(metaEl);
              bindingsDiv.appendChild(node);
            }
          }
        }
      }

      /* ----------------------------------------------------------------
       * Bootstrap
       * -------------------------------------------------------------- */
      renderShell();
      loadCatalog();
      loadBindings();
    </script>
  </body>
</html>
